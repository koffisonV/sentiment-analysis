<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Emotion Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="./static/style.css">
    <script src="./static/mywebscript.js" defer></script>
</head>

<body>
    <div class="app-wrapper">
        <div class="app-header">
            <h1>NLP Emotion Detection</h1>
            <p>Analyzes text and returns emotion scores using a transformer model.</p>
        </div>

        <div class="row no-gutters" style="gap: 0;">
            <div class="col-md-5 pr-md-3 mb-3 mb-md-0">
                <div class="panel">
                    <div class="panel-label">Input</div>
                    <textarea id="textToAnalyze" placeholder="Enter text to analyze..."></textarea>
                    <button class="btn-analyze" onclick="RunSentimentAnalysis()">Analyze</button>
                </div>
            </div>

            <div class="col-md-7">
                <div class="panel">
                    <div class="panel-label">Results</div>
                    <div id="system_response">
                        <div class="results-placeholder">Results will appear here after analysis.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
